name: Bento
options:
  bundleIdPrefix: com.bento
  deploymentTarget:
    iOS: "17.0"
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  Bento:
    type: application
    platform: iOS
    sources:
      - path: Bento/App
      - path: Bento/Home
      - path: Bento/Gym
      - path: Bento/Todo
      - path: Bento/Flashcards
      - path: Bento/Files
      - path: Bento/Video
      - path: Bento/Shared
      - path: Bento/Assets.xcassets
      - path: Bento/Resources/exercises.json
        optional: true  # Lyfta-derived, kept out of git
        buildPhase: resources
      - path: Bento/Resources/my_exercises.json
        optional: true  # Lyfta-derived, kept out of git
        buildPhase: resources
      - path: Bento/Resources/MuscleImages
        optional: true  # Lyfta-derived, kept out of git
        type: folder
        buildPhase: resources
      - path: Bento/Resources/ExerciseMedia
        optional: true  # Lyfta-derived, kept out of git
        type: folder
        buildPhase: resources
    info:
      path: Bento/Info.plist
      properties:
        # From Config.xcconfig (gitignored)
        NotionSecret: $(NOTION_SECRET)
        TodoDatabase: $(TODO_DB)
        DecksDatabase: $(DECKS_DB)
        CardsDatabase: $(CARDS_DB)
        GymLogDatabase: $(GYMLOG_DB)
        GymsDatabase: $(GYMS_DB)
        AppGroup: group.$(BUNDLE_ID_PREFIX).bento
        CoursesDatabase: $(COURSES_DB)
        NSPhotoLibraryAddUsageDescription: Bento saves downloaded videos and photos to your library.
        # Only standard HTTPS, so TestFlight uploads skip the export-compliance question
        ITSAppUsesNonExemptEncryption: false
        # "Bento" alone is taken on the App Store (error 90129); matches the App Store Connect name
        CFBundleDisplayName: Bento Toolbox
        CFBundleName: Bento Toolbox
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Documents (incl. Downloads) shows up in the Files app
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    entitlements:
      path: Bento/Bento.entitlements
      properties:
        com.apple.security.application-groups:
          - group.$(BUNDLE_ID_PREFIX).bento
    dependencies:
      - target: BentoShare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).bento
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        TARGETED_DEVICE_FAMILY: "1"  # iPhone only
        INFOPLIST_KEY_CFBundleDisplayName: "Bento Toolbox"
        ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
        SWIFT_STRICT_CONCURRENCY: minimal

  BentoShare:
    type: app-extension
    platform: iOS
    sources:
      - path: Bento/Share
      - path: Bento/Shared
    info:
      path: Bento/Share/Info.plist
      properties:
        CFBundleDisplayName: Bento Toolbox
        CFBundleName: Bento Toolbox
        AppGroup: group.$(BUNDLE_ID_PREFIX).bento
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSPhotoLibraryAddUsageDescription: Bento saves downloaded videos and photos to your library.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    entitlements:
      path: Bento/Share/BentoShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.$(BUNDLE_ID_PREFIX).bento
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).bento.share
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_STRICT_CONCURRENCY: minimal
